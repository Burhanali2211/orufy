# =============================================================================
# Nginx Custom Domains & Reverse Proxy Configuration
# Architecture: Hostinger VPS -> Nginx (TLS / Catch-All) -> Node/Express (Port 3001)
# =============================================================================

# 1. Hostile Catch-All: Reject unknown hostnames, direct IP scans, or unmapped SNI
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Return 444 (No Response / Close Connection) for unknown hosts
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Default fallback self-signed certificate for rejecting unmatched TLS SNI
    ssl_certificate /etc/nginx/ssl/default-fallback.crt;
    ssl_certificate_key /etc/nginx/ssl/default-fallback.key;

    return 444;
}

# 2. ACME HTTP-01 Webroot Challenge (For Let's Encrypt / Certbot verification)
server {
    listen 80;
    listen [::]:80;
    server_name .platform.com; # Matches platform subdomains & dynamic custom domains

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Main Reverse Proxy Block for Platform & Verified Custom Domains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Matches primary platform wildcard & dynamically managed custom domains
    server_name *.platform.com;

    # Wildcard certificate for platform subdomains
    ssl_certificate /etc/letsencrypt/live/platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Node/Express Application
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Canonical Host Header Forwarding (Crucial for Server-Authoritative Multi-Tenancy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
