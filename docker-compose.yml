version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: platform_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: platform_db
    ports:
      - "127.0.0.1:5433:5432" # Only expose to localhost for safety
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - platform_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platform_backend
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://platform_app:password@postgres:5432/platform_db
      - PLATFORM_DOMAIN=get-oru.com
    volumes:
      - uploads_data:/app/uploads
    # NO PORTS EXPOSED OUTSIDE. Only reachable via Nginx on the internal network.
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - platform_net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: platform_nginx
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orufy.rule=Host(`get-oru.com`) || HostRegexp(`^[a-z0-9-]+\\.get-oru\\.com$`)"
      - "traefik.http.routers.orufy.entrypoints=websecure"
      - "traefik.http.routers.orufy.tls.certresolver=cloudflare"
      - "traefik.http.routers.orufy.tls.domains[0].main=get-oru.com"
      - "traefik.http.routers.orufy.tls.domains[0].sans=*.get-oru.com"
      - "traefik.http.services.orufy.loadbalancer.server.port=80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  uploads_data:
